<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CHORÃO ONLINE — Prontera Field (Estilo Ragnarök)</title>
  
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e14;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* HUD Retrô Ragnarök */
    .rag-panel {
      background: linear-gradient(180deg, rgba(35, 46, 68, 0.92) 0%, rgba(18, 24, 38, 0.96) 100%);
      border: 2px solid #5a759e;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.2);
      backdrop-filter: blur(6px);
      position: absolute;
      z-index: 10;
    }

    /* Painel do Topo Esquerdo: Info Jogador */
    #player-hud {
      top: 14px;
      left: 14px;
      padding: 12px 16px;
      min-width: 260px;
    }
    .char-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffd166;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .char-level {
      background: #e63946;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }
    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .bar-label {
      width: 32px;
      font-size: 10px;
      color: #cbd5e1;
    }
    .bar-track {
      flex: 1;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      position: relative;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s ease;
    }
    .bar-fill-hp { background: linear-gradient(90deg, #e63946, #ff758f); }
    .bar-fill-sp { background: linear-gradient(90deg, #1d4ed8, #60a5fa); }
    .bar-fill-exp { background: linear-gradient(90deg, #059669, #34d399); }

    /* Topo Direito: Zeny e Inventário */
    #status-hud {
      top: 14px;
      right: 14px;
      padding: 10px 14px;
      text-align: right;
      font-size: 12px;
    }
    .zeny-box {
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 4px;
    }
    .inventory-pills {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Caixa de Notificação Central (Dano / Drop) */
    #combat-log {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }
    .log-item {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255,255,255,0.2);
      animation: fadeUp 1.8s forwards;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      15% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    /* Barra Inferior com Controles */
    #bottom-bar {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      z-index: 10;
    }
    .hud-btn {
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      color: #fff;
      border: 1px solid #64748b;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .hud-btn:hover {
      background: #475569;
      border-color: #94a3b8;
      transform: translateY(-2px);
    }
    .hud-btn:active {
      transform: translateY(0);
    }

    /* Alvo Atual (Monstro selecionado) */
    #target-hud {
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      display: none;
      min-width: 240px;
      text-align: center;
    }
    #target-name {
      font-weight: 800;
      font-size: 13px;
      color: #ff758f;
      margin-bottom: 4px;
    }

    /* Dica Flutuante */
    #click-tip {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <!-- Painel do Jogador -->
  <div id="player-hud" class="rag-panel">
    <div class="char-title">
      <span>Novato Chorão</span>
      <span class="char-level" id="player-lvl">Base Lv. 1</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">HP</span>
      <div class="bar-track">
        <div id="hp-bar" class="bar-fill bar-fill-hp" style="width: 100%;"></div>
      </div>
      <span style="margin-left: 8px; font-size: 10px;" id="hp-text">250/250</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">SP</span>
      <div class="bar-track">
        <div id="sp-bar" class="bar-fill bar-fill-sp" style="width: 100%;"></div>
      </div>
      <span style="margin-left: 8px; font-size: 10px;" id="sp-text">60/60</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">EXP</span>
      <div class="bar-track">
        <div id="exp-bar" class="bar-fill bar-fill-exp" style="width: 0%;"></div>
      </div>
      <span style="margin-left: 8px; font-size: 10px;" id="exp-text">0%</span>
    </div>
  </div>

  <!-- Alvo Focado (Poring) -->
  <div id="target-hud" class="rag-panel">
    <div id="target-name">Poring [Nv. 1]</div>
    <div class="bar-track" style="height: 8px;">
      <div id="target-hp-bar" class="bar-fill bar-fill-hp" style="width: 100%;"></div>
    </div>
  </div>

  <!-- Moedas e Drops -->
  <div id="status-hud" class="rag-panel">
    <div class="zeny-box">
      <span>🪙</span> <span id="zeny-val">150</span> Zeny
    </div>
    <div class="inventory-pills" id="drops-count">
      Gelatinas: 0 | Maçãs: 0
    </div>
  </div>

  <!-- Combat Log -->
  <div id="combat-log"></div>

  <!-- Dica de Controles -->
  <div id="click-tip">
    🖱️ Clique no chão para andar | Clique no Poring para atacar | WASD para movimentação livre
  </div>

  <!-- Barra de Ações -->
  <div id="bottom-bar" class="rag-panel">
    <button class="hud-btn" id="btn-attack">⚔️ Golpear</button>
    <button class="hud-btn" id="btn-bash">💥 Golpe Fulminante (10 SP)</button>
    <button class="hud-btn" id="btn-respawn">✨ Respawn Porings</button>
  </div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

    // Estado do Jogador estilo RPG
    const playerState = {
      lvl: 1,
      hp: 250,
      maxHp: 250,
      sp: 60,
      maxSp: 60,
      exp: 0,
      expNext: 100,
      zeny: 150,
      jellopy: 0,
      apple: 0,
      targetEnemy: null
    };

    function showLog(text, color = "#ffd166") {
      const log = document.getElementById("combat-log");
      const item = document.createElement("div");
      item.className = "log-item";
      item.style.color = color;
      item.innerText = text;
      log.appendChild(item);
      setTimeout(() => item.remove(), 1800);
    }

    function updateUI() {
      document.getElementById("hp-bar").style.width = `${(playerState.hp / playerState.maxHp) * 100}%`;
      document.getElementById("hp-text").innerText = `${playerState.hp}/${playerState.maxHp}`;
      
      document.getElementById("sp-bar").style.width = `${(playerState.sp / playerState.maxSp) * 100}%`;
      document.getElementById("sp-text").innerText = `${playerState.sp}/${playerState.maxSp}`;
      
      const expPct = Math.floor((playerState.exp / playerState.expNext) * 100);
      document.getElementById("exp-bar").style.width = `${expPct}%`;
      document.getElementById("exp-text").innerText = `${expPct}%`;
      
      document.getElementById("player-lvl").innerText = `Base Lv. ${playerState.lvl}`;
      document.getElementById("zeny-val").innerText = playerState.zeny;
      document.getElementById("drops-count").innerText = `Gelatinas: ${playerState.jellopy} | Maçãs: ${playerState.apple}`;

      const targetHud = document.getElementById("target-hud");
      if (playerState.targetEnemy && !playerState.targetEnemy.isDead) {
        targetHud.style.display = "block";
        document.getElementById("target-name").innerText = `${playerState.targetEnemy.name} [Nv. ${playerState.targetEnemy.lvl}]`;
        const tHpPct = (playerState.targetEnemy.hp / playerState.targetEnemy.maxHp) * 100;
        document.getElementById("target-hp-bar").style.width = `${Math.max(0, tHpPct)}%`;
      } else {
        targetHud.style.display = "none";
      }
    }

    // Criar a Cena
    const createScene = function() {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.5, 0.75, 0.95, 1);
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.006;
      scene.fogColor = new BABYLON.Color3(0.65, 0.8, 0.95);

      // Câmera estilo Ragnarök (vista isométrica/terceira pessoa suave)
      const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 3, 26, new BABYLON.Vector3(0, 1, 0), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 12;
      camera.upperRadiusLimit = 42;
      camera.upperBetaLimit = Math.PI / 2.2;

      // Luz Solar e Ambiente
      const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6, -1, 0.5), scene);
      sun.intensity = 1.6;
      sun.diffuse = new BABYLON.Color3(1, 0.98, 0.88);

      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.8;
      hemi.groundColor = new BABYLON.Color3(0.2, 0.35, 0.15);

      // Gerador de Sombras
      const shadowGenerator = new BABYLON.ShadowGenerator(1024, sun);
      shadowGenerator.useBlurExponentialShadowMap = true;
      shadowGenerator.blurKernel = 16;

      // Terreno Verdejante (Prontera Field)
      const ground = BABYLON.MeshBuilder.CreateGroundFromHeightMap("ground", 
        "https://playground.babylonjs.com/textures/heightMap.png", {
          width: 220,
          height: 220,
          subdivisions: 120,
          minHeight: 0,
          maxHeight: 4,
          onReady: function(gr) {
            gr.receiveShadows = true;
          }
        }, scene);

      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/grass.png", scene);
      groundMat.diffuseTexture.uScale = 25;
      groundMat.diffuseTexture.vScale = 25;
      groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      ground.material = groundMat;

      // Skybox Clássico
      const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 600 }, scene);
      const skyboxMaterial = new BABYLON.StandardMaterial("skyBoxMat", scene);
      skyboxMaterial.backFaceCulling = false;
      skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture("https://playground.babylonjs.com/textures/skybox", scene);
      skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
      skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0);
      skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
      skybox.material = skyboxMaterial;

      // Marcador de clique no chão (Target reticle verde)
      const clickMarker = BABYLON.MeshBuilder.CreateTorus("clickMarker", { diameter: 1.5, thickness: 0.1, tessellation: 24 }, scene);
      const markerMat = new BABYLON.StandardMaterial("markerMat", scene);
      markerMat.emissiveColor = new BABYLON.Color3(0.2, 1, 0.4);
      markerMat.alpha = 0.8;
      clickMarker.material = markerMat;
      clickMarker.isVisible = false;

      // Personagem do Jogador (Herói com visual aventureiro)
      const hero = new BABYLON.TransformNode("hero", scene);
      hero.position = new BABYLON.Vector3(0, 0, 0);

      // Corpo estilizado do aventureiro
      const bodyMat = new BABYLON.StandardMaterial("heroBodyMat", scene);
      bodyMat.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.85);

      const skinMat = new BABYLON.StandardMaterial("heroSkinMat", scene);
      skinMat.diffuseColor = new BABYLON.Color3(1, 0.82, 0.7);

      const hairMat = new BABYLON.StandardMaterial("heroHairMat", scene);
      hairMat.diffuseColor = new BABYLON.Color3(0.9, 0.65, 0.2); // Loiro estilo Ragnarök

      const heroBody = BABYLON.MeshBuilder.CreateCylinder("heroBody", { height: 1.5, diameterTop: 0.6, diameterBottom: 0.8 }, scene);
      heroBody.position.y = 1.0;
      heroBody.material = bodyMat;
      heroBody.parent = hero;
      shadowGenerator.addShadowCaster(heroBody);

      const heroHead = BABYLON.MeshBuilder.CreateSphere("heroHead", { diameter: 0.8 }, scene);
      heroHead.position.y = 2.0;
      heroHead.material = skinMat;
      heroHead.parent = hero;
      shadowGenerator.addShadowCaster(heroHead);

      const heroHair = BABYLON.MeshBuilder.CreateSphere("heroHair", { diameter: 0.88, slice: 0.6 }, scene);
      heroHair.rotation.x = Math.PI;
      heroHair.position.y = 2.15;
      heroHair.material = hairMat;
      heroHair.parent = hero;

      // Espada do Aprendiz
      const sword = BABYLON.MeshBuilder.CreateBox("sword", { width: 0.12, height: 1.2, depth: 0.05 }, scene);
      const swordMat = new BABYLON.StandardMaterial("swordMat", scene);
      swordMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.95);
      swordMat.specularColor = new BABYLON.Color3(1, 1, 1);
      sword.material = swordMat;
      sword.position = new BABYLON.Vector3(0.55, 1.2, 0.3);
      sword.rotation.z = -Math.PI / 4;
      sword.parent = hero;
      shadowGenerator.addShadowCaster(sword);

      // ==========================================
      // FÁBRICA DE PORINGS (Estilo Ragnarök)
      // ==========================================
      const poringMaterial = new BABYLON.StandardMaterial("poringMat", scene);
      poringMaterial.diffuseColor = new BABYLON.Color3(1, 0.45, 0.55); // Rosa clássico
      poringMaterial.specularColor = new BABYLON.Color3(0.8, 0.6, 0.7);
      poringMaterial.emissiveColor = new BABYLON.Color3(0.3, 0.05, 0.1);

      const eyeWhiteMat = new BABYLON.StandardMaterial("eyeWhite", scene);
      eyeWhiteMat.diffuseColor = new BABYLON.Color3(1, 1, 1);

      const eyePupilMat = new BABYLON.StandardMaterial("eyePupil", scene);
      eyePupilMat.diffuseColor = new BABYLON.Color3(0, 0, 0);

      const enemies = [];

      function createPoring(x, z, name = "Poring", lvl = 1, hp = 60) {
        const root = new BABYLON.TransformNode("poring_root", scene);
        root.position = new BABYLON.Vector3(x, 0, z);

        // Corpo gelatinoso achatado
        const blob = BABYLON.MeshBuilder.CreateSphere("blob", { diameterX: 1.2, diameterY: 0.95, diameterZ: 1.1, segments: 16 }, scene);
        blob.position.y = 0.5;
        blob.material = poringMaterial;
        blob.parent = root;
        shadowGenerator.addShadowCaster(blob);

        // Olho Esquerdo
        const eyeL = BABYLON.MeshBuilder.CreateSphere("eyeL", { diameterX: 0.18, diameterY: 0.28, diameterZ: 0.1 }, scene);
        eyeL.position = new BABYLON.Vector3(-0.25, 0.65, 0.48);
        eyeL.material = eyeWhiteMat;
        eyeL.parent = root;

        const pupilL = BABYLON.MeshBuilder.CreateSphere("pupilL", { diameter: 0.1 }, scene);
        pupilL.position = new BABYLON.Vector3(-0.25, 0.65, 0.54);
        pupilL.material = eyePupilMat;
        pupilL.parent = root;

        // Olho Direito
        const eyeR = BABYLON.MeshBuilder.CreateSphere("eyeR", { diameterX: 0.18, diameterY: 0.28, diameterZ: 0.1 }, scene);
        eyeR.position = new BABYLON.Vector3(0.25, 0.65, 0.48);
        eyeR.material = eyeWhiteMat;
        eyeR.parent = root;

        const pupilR = BABYLON.MeshBuilder.CreateSphere("pupilR", { diameter: 0.1 }, scene);
        pupilR.position = new BABYLON.Vector3(0.25, 0.65, 0.54);
        pupilR.material = eyePupilMat;
        pupilR.parent = root;

        // Metadados do Monstro
        const enemyData = {
          name,
          lvl,
          hp,
          maxHp: hp,
          root,
          blob,
          isDead: false,
          bounceOffset: Math.random() * 10,
          speed: 0.02 + Math.random() * 0.02,
          targetPos: new BABYLON.Vector3(x, 0, z)
        };

        // Clique no Poring para selecionar/atacar
        blob.actionManager = new BABYLON.ActionManager(scene);
        blob.actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, function () {
            selectTarget(enemyData);
          })
        );

        enemies.push(enemyData);
        return enemyData;
      }

      // Spawna 14 Porings pelo campo
      function spawnFieldPorings() {
        enemies.forEach(e => {
          if (e.root) e.root.dispose();
        });
        enemies.length = 0;

        for (let i = 0; i < 14; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 10 + Math.random() * 45;
          const px = Math.cos(angle) * dist;
          const pz = Math.sin(angle) * dist;
          createPoring(px, pz, "Poring", 1, 50);
        }
      }
      spawnFieldPorings();

      // ==========================================
      // SISTEMA DE NÚMERO DE DANO FLUTUANTE
      // ==========================================
      function showDamageNumber(pos, amount, isCrit = false) {
        const textPlane = BABYLON.MeshBuilder.CreatePlane("dmgText", { width: 3, height: 1.5 }, scene);
        textPlane.position = pos.clone().add(new BABYLON.Vector3(0, 1.8, 0));
        textPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

        const advTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(textPlane);
        const textBlock = new BABYLON.GUI.TextBlock();
        textBlock.text = `${amount}`;
        textBlock.color = isCrit ? "#ffea00" : "#ffffff";
        textBlock.fontSize = isCrit ? 64 : 48;
        textBlock.fontFamily = "'Cinzel', sans-serif";
        textBlock.fontWeight = "bold";
        textBlock.outlineWidth = 6;
        textBlock.outlineColor = isCrit ? "#d90429" : "#000000";
        advTexture.addControl(textBlock);

        // Animação de subida e descarte
        let elapsed = 0;
        const obs = scene.onBeforeRenderObservable.add(() => {
          elapsed += 0.03;
          textPlane.position.y += 0.04;
          if (elapsed > 1.2) {
            scene.onBeforeRenderObservable.remove(obs);
            textPlane.dispose();
          }
        });
      }

      // Drop de item no chão
      function spawnDrop(pos) {
        const isApple = Math.random() > 0.6;
        const dropMesh = BABYLON.MeshBuilder.CreateSphere("dropItem", { diameter: 0.4 }, scene);
        dropMesh.position = pos.clone().add(new BABYLON.Vector3(0, 0.4, 0));
        
        const dropMat = new BABYLON.StandardMaterial("dropMat", scene);
        dropMat.diffuseColor = isApple ? new BABYLON.Color3(0.9, 0.1, 0.1) : new BABYLON.Color3(0.2, 0.7, 0.9);
        dropMat.emissiveColor = isApple ? new BABYLON.Color3(0.4, 0, 0) : new BABYLON.Color3(0, 0.3, 0.4);
        dropMesh.material = dropMat;

        showLog(`Item dropado: ${isApple ? "🍎 Maçã" : "💧 Gelatina de Poring"}!`, "#70e000");

        // Coleta automática ao passar perto
        const checkCollect = scene.onBeforeRenderObservable.add(() => {
          dropMesh.rotation.y += 0.05;
          const dist = BABYLON.Vector3.Distance(hero.position, dropMesh.position);
          if (dist < 2.0) {
            if (isApple) {
              playerState.apple++;
              playerState.hp = Math.min(playerState.maxHp, playerState.hp + 30);
              showLog("+30 HP curado com Maçã!", "#38b000");
            } else {
              playerState.jellopy++;
              playerState.zeny += 18;
              showLog("+18 Zeny obtido!", "#ffbe0b");
            }
            updateUI();
            scene.onBeforeRenderObservable.remove(checkCollect);
            dropMesh.dispose();
          }
        });
      }

      // ==========================================
      // COMBATE E ATAQUE
      // ==========================================
      function selectTarget(enemy) {
        if (enemy.isDead) return;
        playerState.targetEnemy = enemy;
        updateUI();
        showLog(`Alvo: ${enemy.name}!`, "#ff758f");
      }

      function executeAttack(damageBonus = 0, isBash = false) {
        const enemy = playerState.targetEnemy;
        if (!enemy || enemy.isDead) {
          showLog("Selecione um monstro clicando nele!", "#cbd5e1");
          return;
        }

        const dist = BABYLON.Vector3.Distance(hero.position, enemy.root.position);
        if (dist > 3.5) {
          // Anda até o monstro
          targetDestination = enemy.root.position.clone();
          showLog("Aproximando do alvo...", "#94a3b8");
          return;
        }

        // Animação de golpe com a espada
        const swing = new BABYLON.Animation("swordSwing", "rotation.x", 30, BABYLON.Animation.ANIMATIONTYPE_FLOAT, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT);
        swing.setKeys([
          { frame: 0, value: 0 },
          { frame: 5, value: Math.PI / 2 },
          { frame: 10, value: 0 }
        ]);
        sword.animations = [swing];
        scene.beginAnimation(sword, 0, 10, false);

        // Cálculo de dano
        const baseDmg = Math.floor(18 + Math.random() * 12);
        const totalDmg = baseDmg + damageBonus;
        enemy.hp -= totalDmg;

        showDamageNumber(enemy.root.position, totalDmg, isBash);

        if (enemy.hp <= 0) {
          enemy.isDead = true;
          enemy.root.dispose();
          playerState.targetEnemy = null;

          // Recompensas
          const xpGained = 25;
          playerState.exp += xpGained;
          playerState.zeny += 12;
          showLog(`Poring derrotado! +${xpGained} EXP | +12 Zeny`, "#ffd166");

          // Level UP
          if (playerState.exp >= playerState.expNext) {
            playerState.lvl++;
            playerState.exp -= playerState.expNext;
            playerState.expNext = Math.floor(playerState.expNext * 1.5);
            playerState.maxHp += 40;
            playerState.hp = playerState.maxHp;
            playerState.maxSp += 15;
            playerState.sp = playerState.maxSp;
            showLog(`✨ LEVEL UP! Você alcançou o Nível ${playerState.lvl}!`, "#ffea00");
          }

          spawnDrop(enemy.root.position);
        }

        updateUI();
      }

      // Botões de Ação
      document.getElementById("btn-attack").onclick = () => executeAttack(0, false);
      
      document.getElementById("btn-bash").onclick = () => {
        if (playerState.sp < 10) {
          showLog("SP insuficiente!", "#ef4444");
          return;
        }
        playerState.sp -= 10;
        executeAttack(35, true);
        showLog("💥 Golpe Fulminante!", "#f59e0b");
      };

      document.getElementById("btn-respawn").onclick = () => {
        spawnFieldPorings();
        showLog("Porings renasceram no campo!", "#38b000");
      };

      // ==========================================
      // MOVIMENTAÇÃO (POINT & CLICK + WASD)
      // ==========================================
      let targetDestination = null;
      const inputMap = {};

      window.addEventListener("keydown", (evt) => { inputMap[evt.key.toLowerCase()] = true; });
      window.addEventListener("keyup", (evt) => { inputMap[evt.key.toLowerCase()] = false; });

      // Clique com botão esquerdo para andar
      scene.onPointerDown = function(evt, pickResult) {
        if (evt.button === 0) { // Clique esquerdo
          if (pickResult.hit && pickResult.pickedMesh === ground) {
            targetDestination = pickResult.pickedPoint.clone();
            targetDestination.y = 0;

            // Ativa anel verde no chão
            clickMarker.position = targetDestination.clone().add(new BABYLON.Vector3(0, 0.2, 0));
            clickMarker.isVisible = true;
          }
        }
      };

      // Loop Principal de Atualização
      let timer = 0;
      scene.onBeforeRenderObservable.add(() => {
        timer += 0.05;

        // Animação dos Porings (Pulos gelatinosos)
        enemies.forEach(enemy => {
          if (enemy.isDead) return;
          const bounce = Math.abs(Math.sin(timer * 4 + enemy.bounceOffset));
          enemy.blob.position.y = 0.5 + bounce * 0.45;
          // Deforma a gosma no pouso
          enemy.blob.scaling.y = 1 - bounce * 0.25;
          enemy.blob.scaling.x = 1 + bounce * 0.15;
          enemy.blob.scaling.z = 1 + bounce * 0.15;
        });

        // Movimento por Teclado (WASD)
        let movedWithKeys = false;
        const moveSpeed = 0.35;
        const moveVector = new BABYLON.Vector3(0, 0, 0);

        if (inputMap["w"] || inputMap["arrowup"]) { moveVector.z += 1; movedWithKeys = true; }
        if (inputMap["s"] || inputMap["arrowdown"]) { moveVector.z -= 1; movedWithKeys = true; }
        if (inputMap["a"] || inputMap["arrowleft"]) { moveVector.x -= 1; movedWithKeys = true; }
        if (inputMap["d"] || inputMap["arrowright"]) { moveVector.x += 1; movedWithKeys = true; }

        if (movedWithKeys) {
          targetDestination = null;
          clickMarker.isVisible = false;
          moveVector.normalize();
          hero.position.addInPlace(moveVector.scale(moveSpeed));
          hero.rotation.y = Math.atan2(moveVector.x, moveVector.z);
        } 
        // Movimento Point & Click
        else if (targetDestination) {
          const toTarget = targetDestination.subtract(hero.position);
          toTarget.y = 0;
          const dist = toTarget.length();

          if (dist > 0.4) {
            toTarget.normalize();
            hero.position.addInPlace(toTarget.scale(moveSpeed));
            hero.rotation.y = Math.atan2(toTarget.x, toTarget.z);
          } else {
            targetDestination = null;
            clickMarker.isVisible = false;
          }
        }

        // Câmera segue o herói suavemente
        camera.target = BABYLON.Vector3.Lerp(camera.target, hero.position.clone().add(new BABYLON.Vector3(0, 1.5, 0)), 0.1);
      });

      // Árvores decorativas de Prontera
      for (let i = 0; i < 28; i++) {
        const tx = (Math.random() - 0.5) * 160;
        const tz = (Math.random() - 0.5) * 160;
        if (Math.hypot(tx, tz) > 12) {
          const trunk = BABYLON.MeshBuilder.CreateCylinder("trunk", { height: 3, diameter: 0.6 }, scene);
          trunk.position = new BABYLON.Vector3(tx, 1.5, tz);
          const tMat = new BABYLON.StandardMaterial("tMat", scene);
          tMat.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.1);
          trunk.material = tMat;

          const foliage = BABYLON.MeshBuilder.CreateSphere("foliage", { diameter: 4.5, segments: 6 }, scene);
          foliage.position = new BABYLON.Vector3(tx, 4.2, tz);
          const fMat = new BABYLON.StandardMaterial("fMat", scene);
          fMat.diffuseColor = new BABYLON.Color3(0.15, 0.6, 0.2);
          foliage.material = fMat;
        }
      }

      return scene;
    };

    const scene = createScene();
    updateUI();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
