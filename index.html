<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b2c"><title>CHORÃO ONLINE — O Vale Esquecido</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2c;color:#fff;font-family:system-ui,Segoe UI,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:fixed;z-index:2;left:16px;top:16px;width:min(300px,calc(100vw - 32px));padding:14px 16px;border:1px solid #ffffff35;border-radius:14px;background:linear-gradient(145deg,#14243aeF,#142b37df);box-shadow:0 12px 36px #0005}.brand{font-size:17px;font-weight:950;letter-spacing:.09em}.sub{color:#b4d5d5;font-size:11px;margin:2px 0 12px}.hero{display:flex;gap:10px;align-items:center}.portrait{width:43px;height:43px;border-radius:10px;background:#335b56;display:grid;place-items:center;font-size:25px}.name{font-size:13px;font-weight:800}.level{font-size:11px;color:#bdd5df}.bar{height:7px;background:#07151d;border-radius:10px;overflow:hidden;margin-top:5px}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#e45c64,#ffb36e)}.bar.mana i{background:linear-gradient(90deg,#47a9f4,#9a8cff)}.quest{position:fixed;left:16px;top:151px;width:min(280px,calc(100vw - 32px));padding:12px 14px;border-left:3px solid #e9c47d;background:#142538d9;border-radius:0 10px 10px 0;z-index:2}.quest b{font-size:11px;color:#f3d28b;letter-spacing:.08em}.quest p{margin:5px 0 0;font-size:12px;line-height:1.5;color:#d7e6e5}.stats{position:fixed;right:16px;top:16px;z-index:2;padding:10px 13px;border:1px solid #ffffff30;background:#142538df;border-radius:12px;font-size:12px}.stats strong{color:#f5d88b}.toast{position:fixed;z-index:3;left:50%;top:22px;transform:translateX(-50%);max-width:calc(100vw - 30px);padding:10px 16px;background:#102333ed;border:1px solid #ffffff32;border-radius:12px;font-size:12px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.bottom{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center}.bottom button,.mobile button{color:#fff;border:1px solid #d7e9db55;background:linear-gradient(#294a4c,#172d38);border-radius:12px;padding:10px 13px;font-weight:750;box-shadow:0 4px 12px #0004}.bottom button:active,.mobile button:active{transform:scale(.95);background:#416b63}.mobile{position:fixed;z-index:3;bottom:20px;left:15px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:4px}.mobile button{padding:0;font-size:19px;touch-action:none}.mobile [data-k=w]{grid-column:2}.mobile [data-k=a]{grid-column:1;grid-row:2}.mobile [data-k=s]{grid-column:2;grid-row:2}.mobile [data-k=d]{grid-column:3;grid-row:2}.act{position:fixed;z-index:3;right:18px;bottom:24px;display:flex;flex-direction:column;gap:9px}.act button{width:58px;height:58px;border-radius:50%;font-size:22px;padding:0}.help{position:fixed;right:16px;bottom:16px;color:#e5f1e7a8;font-size:10px;text-align:right;pointer-events:none}@media(max-width:650px){.hud{padding:10px 12px;width:220px;top:10px;left:10px}.brand{font-size:14px}.portrait{width:34px;height:34px}.quest{top:112px;left:10px;width:205px;padding:9px 11px}.quest p{font-size:11px}.stats{top:10px;right:10px;font-size:11px}.bottom{bottom:14px;left:50%;gap:4px}.bottom button{padding:9px 10px;font-size:11px}.help{display:none}.mobile{bottom:16px;left:10px;grid-template-columns:43px 43px 43px;grid-template-rows:43px 43px}.act{right:10px;bottom:16px}.act button{width:49px;height:49px}.toast{top:120px}}@media(min-width:900px){.mobile{opacity:.3}.mobile:hover{opacity:1}}
</style></head><body><div id="game"></div>
<section class="hud"><div class="brand">✦ CHORÃO ONLINE</div><div class="sub">O VALE ESQUECIDO · CAPÍTULO I</div><div class="hero"><div class="portrait">🧝</div><div style="flex:1"><div class="name">Guardião do Vale <span class="level">Nv. 1</span></div><div class="bar"><i id="hp"></i></div><div class="bar mana"><i id="mp"></i></div></div></div></section>
<section class="quest"><b>✧ MISSÃO PRINCIPAL</b><p id="quest">Os espíritos da floresta perderam suas estrelas. Recolha os fragmentos luminosos e descubra o que despertou nas ruínas.</p></section>
<div class="stats">✦ Fragmentos <strong id="count">0 / 8</strong></div><div class="toast" id="toast"></div>
<div class="mobile"><button data-k="w">▲</button><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div class="act"><button id="spell" title="Magia">✧</button><button id="interact" title="Interagir">✋</button></div>
<div class="bottom"><button id="mapBtn">🗺 Mapa</button><button id="bagBtn">🎒 Mochila</button><button id="soundBtn">♫ Som: off</button></div><div class="help">WASD / setas para andar · E para interagir · Espaço para magia</div>
<script>
(()=>{
const root=document.getElementById('game'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');root.appendChild(canvas);
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,1.5);function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const tile=32,world={w:100,h:100},keys=new Set();let count=0,toastTimer=0,sceneMode='world',sound=false,spellFx=0,cam={x:0,y:0};
const rand=(a,b)=>a+Math.random()*(b-a),hash=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
let player={x:50*tile,y:50*tile,dir:0,step:0,hp:100,mp:100};let crystals=[],trees=[],flowers=[],rocks=[],creatures=[];
try{const s=JSON.parse(localStorage.getItem('cho-save-v2')||'null');if(s){player.x=s.x;player.y=s.y;count=s.count||0;document.getElementById('count').textContent=count+' / 8'}}catch(e){}
for(let i=0;i<8;i++){let x,y;do{x=rand(8,92)*tile;y=rand(8,92)*tile}while(Math.hypot(x-player.x,y-player.y)<180);crystals.push({x,y,got:i<count,phase:rand(0,7)})}
for(let i=0;i<700;i++){let x=rand(2,98)*tile,y=rand(2,98)*tile;if(Math.hypot(x-player.x,y-player.y)<100)continue;const r=rand(8,17);if(hash(i,3)>.18)trees.push({x,y,r,kind:Math.floor(hash(i,4)*4),phase:rand(0,6)});else rocks.push({x,y,r:rand(5,11)})}
for(let i=0;i<500;i++)flowers.push({x:rand(1,99)*tile,y:rand(1,99)*tile,c:['#f3d58d','#e8a8b4','#b8b4e9','#e6e6c1'][i%4],r:rand(1,2.2)});
for(let i=0;i<16;i++)creatures.push({x:rand(12,88)*tile,y:rand(12,88)*tile,phase:rand(0,6),alive:true,hp:2});
const palettes={grass:['#496f50','#507b54','#557e58','#456a4c','#5c8157'],dark:'#284b3d',path:'#b59b70',pathLight:'#d0b58a',water:'#397c82'};
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawGround(sx,sy){ctx.fillStyle='#294d3e';ctx.fillRect(0,0,W,H);let x0=Math.floor(sx/tile),y0=Math.floor(sy/tile),x1=x0+Math.ceil(W/tile)+2,y1=y0+Math.ceil(H/tile)+2;
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const v=hash(x,y);ctx.fillStyle=palettes.grass[Math.floor(v*palettes.grass.length)];ctx.fillRect(x*tile-sx,y*tile-sy,tile+1,tile+1);if(v>.72){ctx.fillStyle='#9dbb7950';ctx.fillRect(x*tile-sx+hash(x+2,y)*25,y*tile-sy+hash(x,y+3)*25,2,2)}if(v<.09){ctx.fillStyle='#1d443b';ctx.fillRect(x*tile-sx+8,y*tile-sy+17,7,2)}}}
function drawPath(sx,sy){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(50*tile-sx,100*tile-sy);ctx.bezierCurveTo(40*tile-sx,80*tile-sy,63*tile-sx,70*tile-sy,48*tile-sx,54*tile-sy);ctx.bezierCurveTo(35*tile-sx,39*tile-sy,48*tile-sx,25*tile-sy,53*tile-sx,0-sy);ctx.strokeStyle='#725d49';ctx.lineWidth=tile*2.3;ctx.stroke();ctx.beginPath();ctx.moveTo(50*tile-sx,100*tile-sy);ctx.bezierCurveTo(40*tile-sx,80*tile-sy,63*tile-sx,70*tile-sy,48*tile-sx,54*tile-sy);ctx.bezierCurveTo(35*tile-sx,39*tile-sy,48*tile-sx,25*tile-sy,53*tile-sx,0-sy);ctx.strokeStyle=palettes.path;ctx.lineWidth=tile*2;ctx.stroke();for(let i=0;i<120;i++){let x=hash(i,77)*W,y=hash(i,88)*H;if(hash(i,89)>.7){ctx.fillStyle='#6f624d55';ctx.fillRect(x,y,3,2)}}}
function drawTree(t,sx,sy,time){const x=t.x-sx,y=t.y-sy;if(x< -70||x>W+70||y< -90||y>H+70)return;ctx.fillStyle='#172b2a55';ctx.beginPath();ctx.ellipse(x+5,y+13,t.r*1.35,t.r*.7,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#664b38';rounded(x-t.r*.22,y-t.r*.15,t.r*.44,t.r*1.3,3);ctx.fillStyle='#2b503c';ctx.beginPath();ctx.ellipse(x,y-t.r*.5,t.r*1.15,t.r*1.02,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=['#467a4d','#4f8552','#5b8d57','#3e7049'][t.kind];ctx.beginPath();ctx.ellipse(x-t.r*.18,y-t.r*.72,t.r*.92,t.r*.9,-.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#88ac6a80';ctx.beginPath();ctx.ellipse(x-t.r*.34,y-t.r*1.02,t.r*.44,t.r*.34,-.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff0b';ctx.beginPath();ctx.ellipse(x+t.r*.2,y-t.r*.8,t.r*.5,t.r*.7,.4,0,Math.PI*2);ctx.fill()}
function drawPlayer(x,y,time){let bob=Math.abs(Math.sin(player.step))*2,dir=player.dir;ctx.fillStyle='#142b2a66';ctx.beginPath();ctx.ellipse(x,y+12,13,6,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(x,y+bob);let sx=dir===1?-1:1;if(dir===2||dir===3)sx=1;ctx.scale(sx,1);
ctx.fillStyle='#47372d';rounded(-8,-2,6,13,3);rounded(2,-2,6,13,3);ctx.fillStyle='#c18b56';rounded(-9,7,8,5,2);rounded(1,7,8,5,2);
ctx.fillStyle='#263e55';rounded(-10,-14,20,18,5);ctx.fillStyle='#d4b477';ctx.fillRect(-2,-13,4,16);ctx.fillStyle='#315e63';ctx.beginPath();ctx.moveTo(-11,-12);ctx.lineTo(-16,4);ctx.lineTo(-9,1);ctx.closePath();ctx.fill();
let swing=Math.sin(player.step*1.2)*3;ctx.strokeStyle='#d6a57d';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,-10);ctx.lineTo(-12+swing,-2);ctx.moveTo(9,-10);ctx.lineTo(12-swing,-2);ctx.stroke();
ctx.fillStyle='#d8aa82';rounded(-8,-30,16,17,5);ctx.fillStyle='#49342c';ctx.beginPath();ctx.arc(0,-28,9,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-9,-29,3,7);ctx.fillRect(6,-29,3,7);ctx.fillStyle='#e8d7b5';ctx.fillRect(-5,-23,2,2);ctx.fillRect(3,-23,2,2);ctx.fillStyle='#e4bd78';ctx.fillRect(-10,-15,20,3);ctx.restore();if(spellFx>0){ctx.strokeStyle='rgba(129,229,255,'+(spellFx*.55)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,25+(1-spellFx)*35,0,Math.PI*2);ctx.stroke()}}
function drawCrystal(c,sx,sy,time){if(c.got)return;const x=c.x-sx,y=c.y-sy+Math.sin(time*2+c.phase)*4;if(x<-40||x>W+40||y<-40||y>H+40)return;ctx.fillStyle='#72f4e555';ctx.beginPath();ctx.ellipse(x,y+14,14,5,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=18;ctx.shadowColor='#77fff0';ctx.fillStyle='#c1fff4';ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x+10,y);ctx.lineTo(x+4,y+13);ctx.lineTo(x-6,y+11);ctx.lineTo(x-10,y);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#65d8d2';ctx.lineWidth=2;ctx.stroke()}
function drawCreature(c,sx,sy,time){if(!c.alive)return;let x=c.x-sx,y=c.y-sy+Math.abs(Math.sin(time*2+c.phase))*2;if(x<-30||x>W+30||y<-30||y>H+30)return;ctx.fillStyle='#1a322b55';ctx.beginPath();ctx.ellipse(x,y+8,13,5,0,0,7);ctx.fill();ctx.fillStyle='#a0a5d6';ctx.beginPath();ctx.ellipse(x,y,13,11,0,0,7);ctx.fill();ctx.fillStyle='#d8d7ef';ctx.beginPath();ctx.ellipse(x-3,y-4,6,4,-.5,0,7);ctx.fill();ctx.fillStyle='#29334a';ctx.fillRect(x-5,y-1,3,4);ctx.fillRect(x+3,y-1,3,4)}
function draw(time){const sx=Math.max(0,Math.min(world.w*tile-W,player.x-W/2)),sy=Math.max(0,Math.min(world.h*tile-H,player.y-H/2));cam.x=sx;cam.y=sy;drawGround(sx,sy);drawPath(sx,sy);for(const f of flowers){const x=f.x-sx,y=f.y-sy;if(x>0&&x<W&&y>0&&y<H){ctx.fillStyle='#284c3b';ctx.fillRect(x,y,1,4);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(x,y, f.r,0,7);ctx.fill()}}
const things=[...trees.map(t=>({y:t.y,draw:()=>drawTree(t,sx,sy,time)})),...rocks.map(r=>({y:r.y,draw:()=>{let x=r.x-sx,y=r.y-sy;if(x>-20&&x<W+20&&y>-20&&y<H+20){ctx.fillStyle='#475d58';ctx.beginPath();ctx.ellipse(x,y,r.r,r.r*.7,-.2,0,7);ctx.fill();ctx.fillStyle='#83948a';ctx.beginPath();ctx.ellipse(x-r.r*.2,y-r.r*.2,r.r*.5,r.r*.25,-.4,0,7);ctx.fill()}}})),...crystals.filter(c=>!c.got).map(c=>({y:c.y,draw:()=>drawCrystal(c,sx,sy,time)})),...creatures.filter(c=>c.alive).map(c=>({y:c.y,draw:()=>drawCreature(c,sx,sy,time)})),{y:player.y,draw:()=>drawPlayer(player.x-sx,player.y-sy,time)}].sort((a,b)=>a.y-b.y);for(const o of things)o.draw();if(sceneMode==='map'){ctx.fillStyle='#091c22df';ctx.fillRect(0,0,W,H);ctx.fillStyle='#72966b';ctx.fillRect(W*.2,H*.15,W*.6,H*.7);ctx.strokeStyle='#c8b58b';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(W*.5,H*.85);ctx.bezierCurveTo(W*.35,H*.65,W*.65,H*.45,W*.5,H*.15);ctx.stroke();ctx.fillStyle='#7ffff0';ctx.beginPath();ctx.arc(W*.5,H*.5,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('MAPA DO VALE',W*.2,H*.1);ctx.font='13px system-ui';ctx.fillText('Toque em Mapa para voltar',W*.2,H*.9)}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');toastTimer=2.8}
function save(){try{localStorage.setItem('cho-save-v2',JSON.stringify({x:player.x,y:player.y,count}))}catch(e){}}
function collect(){let best=null,d=tile*1.7;for(const c of crystals){if(c.got)continue;let q=Math.hypot(c.x-player.x,c.y-player.y);if(q<d){d=q;best=c}}if(best){best.got=true;count++;document.getElementById('count').textContent=count+' / 8';document.getElementById('quest').textContent=count===8?'Todas as estrelas foram reunidas! As ruínas começaram a despertar...':'Fragmento encontrado! '+(8-count)+' ainda esperam por você.';toast('✦ Fragmento estelar recolhido!');save();if(count===8)toast('MISSÃO CONCLUÍDA! O vale voltou a brilhar.')}else toast('Aproxime-se de um fragmento luminoso e pressione E.')}
function cast(){if(player.mp<20){toast('Sua energia mágica precisa se recuperar.');return}player.mp-=20;spellFx=1;document.getElementById('mp').style.width=player.mp+'%';let hits=0;for(const c of creatures){if(c.alive&&Math.hypot(c.x-player.x,c.y-player.y)<tile*2.6){c.hp--;hits++;if(c.hp<=0)c.alive=false}}toast(hits?'✧ Pulso astral! Criatura atingida.':'✧ Um pulso de luz se espalha pela floresta.');}
document.getElementById('interact').onclick=collect;document.getElementById('spell').onclick=cast;document.getElementById('mapBtn').onclick=()=>{sceneMode=sceneMode==='map'?'world':'map';toast(sceneMode==='map'?'Mapa do Vale aberto.':'Você voltou à aventura.')};document.getElementById('bagBtn').onclick=()=>toast('Mochila: '+count+' fragmentos estelares · Espada do Guardião · 1 poção');document.getElementById('soundBtn').onclick=e=>{sound=!sound;e.currentTarget.textContent='♫ Som: '+(sound?'on':'off');toast(sound?'Áudio preparado para a próxima etapa.':'Som desativado.')};
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','e'].includes(k)){keys.add(k);e.preventDefault()}if(k==='e')collect();if(k===' ')cast()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys.delete(k)))});
let last=performance.now(),saveT=0;function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;const t=now/1000;if(sceneMode==='world'){let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(dx||dy){let l=Math.hypot(dx,dy);player.x+=dx/l*145*dt;player.y+=dy/l*145*dt;player.dir=dx<0?1:dx>0?0:dy<0?2:3;player.step+=dt*12}player.x=Math.max(tile*2,Math.min(world.w*tile-tile*2,player.x));player.y=Math.max(tile*2,Math.min(world.h*tile-tile*2,player.y));player.mp=Math.min(100,player.mp+dt*4);document.getElementById('mp').style.width=player.mp+'%';for(const c of creatures){if(c.alive&&Math.hypot(c.x-player.x,c.y-player.y)<tile*5){let a=Math.atan2(player.y-c.y,player.x-c.x);c.x-=Math.cos(a)*13*dt;c.y-=Math.sin(a)*13*dt}}}spellFx=Math.max(0,spellFx-dt*1.8);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').classList.remove('show')}saveT+=dt;if(saveT>3){saveT=0;save()}draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
